name: CI/CD - analytics-service

on:
  push:
    branches: [main]
    paths:
      - 'analytics-service/**'
      - '.github/workflows/analytics-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analytics-service/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: analytics-service
  SERVICE_DIR: analytics-service

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependências
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes unitários
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          pip install pytest
          pytest -v || echo "Nenhum teste encontrado ainda"

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Rodar flake8
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=venv

  security-scan:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: SAST - bandit (busca vulnerabilidades no código Python)
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          pip install bandit
          bandit -r . -lll -x ./venv

      - name: SCA - Trivy filesystem scan (busca vulnerabilidades em dependências)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ env.SERVICE_DIR }}
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir tag da imagem (commit hash curto)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker build -t ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }} .

      - name: Scan de vulnerabilidades na imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}'
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

      - name: Tag e Push para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: v1.0.0-${{ steps.vars.outputs.sha_short }}
        run: |
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker tag ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }} $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
